<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pulled Pork & BBQ | Best Butts Around in Jefferson GA</title>
  <meta name="description" content="Craving the best barbecue in Jackson County? Visit The Iron Pig for award-winning slow-smoked pork butts, ribs, brisket and classic Southern sides, we have The Best Butts Around in Jefferson, GA.">
</head>

  <style>
    /* Reset some default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }    

    /* Overall page layout */
    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    table {
    width: 100%; /* Sets table width to its parent container */
    height: 100px; /* Sets fixed height in pixels */
    }

    td {
    text-align: left;   /* Aligns text to the left (default for <td>) */
    vertical-align: top;
    }

    /* Header styling */
    header {
      background-color: #004aad;
      color: white;
      padding: 20px;
      text-align: left;
      font-size: 2em;
      font-weight: bold;
    }

    /* Main content area (two columns) */
    main {
      display: flex;
      flex: 1;
      padding: 5px;
      gap: 2px;
    }

    /* Left column (main content) */
    .content {
      flex-basis 200px;
      background-color: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* Right column (sidebar) */
    .sidebar {
      flex: 0 0 10px;
      background-color: #e8e8e8;
      padding: 1px;
      border-radius: 1px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* Footer styling */   
footer {
      background-color: #000000;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      width: 100%;
    }

    /* Responsive layout for smaller screens */
    @media (max-width: 768px) {
      main {
        flex-direction: column;
      }
    }
	
#backing {
	vertical-align: middle;
	margin: 0;
	overflow: hidden;
}
#backing svg { 
	display: inline-block;
	position: absolute;
	top: 0; left: 0;
}


  </style>
</head>
<body> 

<table>
<tr>
<td>
 <figure id='backing'>

      	</svg>
      </figure> 	   
</td>
</tr>
</table>
